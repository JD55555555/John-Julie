<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsere Galerie – John & Julie</title>

<!--
  ===========================================================
  SETUP: Fotos werden automatisch aus einem geteilten Google-
  Drive-Ordner geladen. Beide könnt ihr über den Upload-Button
  auf dieser Seite neue Fotos hinzufügen – kein GitHub, kein Code.
  Ausführliche Anleitung: galerie-anleitung.md
  Code für Google Apps Script: apps-script-galerie-code.txt

  Kurzfassung:
  1. Google-Drive-Ordner erstellen, mit Julie teilen (Bearbeiten-Recht)
     und Linkfreigabe auf "Jeder mit Link – Betrachter" stellen.
  2. Neues Apps-Script-Projekt (script.google.com) anlegen, Code aus
     apps-script-galerie-code.txt einfügen, FOLDER_ID eintragen.
  3. Bereitstellen -> Web-App (Ausführen als: Ich, Zugriff: Alle).
  4. Die Web-App-URL unten bei APPS_SCRIPT_URL eintragen.
  ===========================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --pink: #f3c9d4;
    --pink-deep: #e8a3b8;
    --beige: #f6efe6;
    --white: #fffaf7;
    --text: #5a4a4a;
    --text-dark: #3d2f2f;
    --shadow: rgba(180, 120, 140, 0.25);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Poppins', sans-serif; color:var(--text); background:var(--beige); }
  h1,h2,h3{ font-family:'Playfair Display', serif; color:var(--text-dark); }

  .site-nav{
    position:fixed; top:0; left:0; right:0; z-index:500;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 6vw;
    background:rgba(255,250,247,0.9);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    box-shadow:0 4px 20px rgba(180,120,140,0.12);
  }
  .site-nav .nav-brand{ font-family:'Playfair Display', serif; font-weight:600; color:var(--text-dark); font-size:1.05rem; }
  .site-nav .nav-links{ display:flex; gap:22px; flex-wrap:wrap; }
  .site-nav .nav-links a{ font-size:0.85rem; color:var(--text); font-weight:500; padding:6px 12px; border-radius:20px; transition:background .2s ease, color .2s ease; }
  .site-nav .nav-links a:hover, .site-nav .nav-links a.active{ background:var(--pink); color:var(--text-dark); }
  @media (max-width:640px){
    .site-nav{ flex-direction:column; gap:8px; padding:10px 4vw; }
    .site-nav .nav-links{ gap:8px; justify-content:center; }
    .site-nav .nav-links a{ font-size:0.72rem; padding:5px 9px; }
  }

  main{ max-width:1100px; margin:0 auto; padding:130px 6vw 90px 6vw; }
  .page-title{ text-align:center; font-size:clamp(1.8rem, 4vw, 2.6rem); margin-bottom:10px; }
  .page-sub{ text-align:center; max-width:560px; margin:0 auto 30px auto; opacity:0.85; }

  /* ---------- Upload-Kachel (klein, in der Galerie) ---------- */
  .add-tile{
    height:110px;
    border-radius:16px;
    border:2px dashed var(--pink-deep);
    background:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    transition:transform .2s ease, background .2s ease;
  }
  .add-tile:hover{ transform:translateY(-3px); background:var(--pink); }
  .add-tile .icon{ font-size:1.6rem; }
  .add-tile span.label{ font-size:0.72rem; color:var(--text); font-weight:500; }
  #fileInput{ display:none; }

  #uploadStatus{
    margin:0 0 20px 0;
    font-size:0.82rem;
    text-align:center;
    display:none;
  }
  #uploadStatus.show{ display:block; }
  #uploadStatus.error{ color:#a33; }
  #uploadStatus.ok{ color:#3a7d44; }

  #galleryStatus{
    text-align:center;
    padding:16px;
    border-radius:12px;
    background:var(--white);
    margin-bottom:24px;
    font-size:0.9rem;
    display:none;
  }
  #galleryStatus.show{ display:block; }
  #galleryStatus.error{ color:#a33; background:#fbe9e9; }

  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px;
  }
  .photo-tile{
    position:relative;
    height:220px;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    background:repeating-linear-gradient(135deg, var(--beige) 0 14px, var(--pink) 14px 28px);
    border:1px dashed var(--pink-deep);
    display:flex;
    align-items:flex-end;
    box-shadow:0 10px 24px var(--shadow);
    transition:transform .3s ease;
  }
  .photo-tile:hover{ transform:translateY(-4px) scale(1.02); }
  .photo-tile img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
  }
  .photo-tile .caption{
    position:relative;
    z-index:1;
    width:100%;
    padding:10px 12px;
    background:linear-gradient(0deg, rgba(61,47,47,0.65), transparent);
    color:#fff;
    font-size:0.82rem;
    font-weight:500;
  }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(61,47,47,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:30px;
  }
  .lightbox.show{ display:flex; }
  .lightbox-inner{
    background:var(--white);
    border-radius:20px;
    padding:26px;
    max-width:520px;
    width:100%;
    text-align:center;
  }
  .lightbox-photo{
    position:relative;
    height:320px;
    border-radius:14px;
    background:repeating-linear-gradient(135deg, var(--beige) 0 14px, var(--pink) 14px 28px);
    border:1px dashed var(--pink-deep);
    margin-bottom:16px;
    overflow:hidden;
  }
  .lightbox-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .lightbox-caption-wrap{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:22px 16px 12px 16px;
    background:linear-gradient(0deg, rgba(61,47,47,0.78), rgba(61,47,47,0.2) 75%, transparent);
  }
  .lightbox-caption-wrap h3{
    color:#fff;
    font-size:1.1rem;
    margin:0;
    cursor:pointer;
    text-shadow:0 1px 4px rgba(0,0,0,0.3);
  }
  .lightbox-caption-wrap .edit-hint{
    color:#fff;
    opacity:0.75;
    font-size:0.68rem;
    margin-top:2px;
  }
  .lightbox-caption-wrap input.edit-title{
    font-family:'Playfair Display', serif;
    font-size:1.1rem;
    width:100%;
    border:none;
    border-radius:8px;
    padding:6px 10px;
    color:var(--text-dark);
    background:#fff;
  }
  .lightbox-buttons{ display:flex; gap:10px; justify-content:center; margin-top:6px; }
  .lightbox-close, .lightbox-edit{
    background:var(--pink-deep);
    color:#fff;
    border:none;
    border-radius:30px;
    padding:10px 24px;
    font-family:'Poppins', sans-serif;
    cursor:pointer;
  }
  .lightbox-edit{ background:var(--white); color:var(--text-dark); border:1px solid var(--pink-deep); }
  .lightbox-delete{ background:#fff; color:#a33; border:1px solid #d99; }

  .empty-hint{
    text-align:center;
    opacity:0.6;
    font-size:0.9rem;
    padding:20px;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-brand">John &amp; Julie</a>
  <div class="nav-links">
    <a href="index.html">Start</a>
    <a href="bucketliste.html">Bucketlist</a>
    <a href="galerie.html" class="active">Galerie</a>
    <a href="memory.html">Memory</a>  </div>
</nav>

<main>
  <h1 class="page-title">Unsere Galerie 📸</h1>
  <p class="page-sub">Die schönsten Erinnerungen aus unseren ersten Monaten.</p>

  <div id="galleryStatus"></div>
  <div id="uploadStatus"></div>

  <div class="gallery-grid" id="galleryWrap">
    <div class="add-tile" id="addTile" title="Neues Foto hinzufügen">
      <span class="icon">📤</span>
      <span class="label">Foto hinzufügen</span>
    </div>
    <div id="galleryGrid" style="display:contents;"></div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple>
  <p class="empty-hint" id="emptyHint" style="display:none;">Noch keine Fotos hochgeladen – klicke oben auf das Symbol!</p>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="lightbox-photo">
      <div class="lightbox-caption-wrap" id="captionWrap"></div>
    </div>
    <div class="lightbox-buttons">
      <button class="lightbox-delete" id="lightboxDelete">Löschen</button>
      <button class="lightbox-close" id="lightboxClose">Schließen</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   KONFIGURATION – HIER ANPASSEN
   Trage hier die Web-App-URL aus Google Apps Script ein
   (siehe galerie-anleitung.md), sie endet auf "/exec"
   ========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5SIb7skZmGTfBLf7DWJuuWI4jBB68_RkYGmG7pmKzfZve1cDEUY4SBh4501ifFqcBqQ/exec";

const galleryGrid = document.getElementById('galleryGrid');
const galleryStatus = document.getElementById('galleryStatus');
const emptyHint = document.getElementById('emptyHint');
const lightbox = document.getElementById('lightbox');
const captionWrap = document.getElementById('captionWrap');
const lightboxClose = document.getElementById('lightboxClose');
const lightboxDelete = document.getElementById('lightboxDelete');
const lightboxPhoto = document.querySelector('.lightbox-photo');
let currentLightboxItem = null;
const addTile = document.getElementById('addTile');
const fileInput = document.getElementById('fileInput');
const uploadStatus = document.getElementById('uploadStatus');

function isConfigured(){
  return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === -1;
}

function showGalleryStatus(text, isError){
  galleryStatus.textContent = text;
  galleryStatus.className = 'show' + (isError ? ' error' : '');
}

function showUploadStatus(text, isError){
  uploadStatus.textContent = text;
  uploadStatus.className = 'show' + (isError ? ' error' : ' ok');
}

async function loadGallery(){
  if(!isConfigured()){
    showGalleryStatus('Die Galerie ist noch nicht mit Google Drive verbunden. Trage im Skript oben die Apps-Script-URL ein (siehe galerie-anleitung.md).', true);
    return;
  }
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    const items = await res.json();
    renderGallery(items);
    galleryStatus.className = '';
  }catch(err){
    showGalleryStatus('Die Fotos konnten nicht geladen werden. Prüfe die Apps-Script-URL und ob die Freigabe auf "Alle" steht.', true);
  }
}

function renderGallery(items){
  galleryGrid.innerHTML = '';
  if(!items || items.length === 0){
    emptyHint.style.display = 'block';
    return;
  }
  emptyHint.style.display = 'none';
  items.forEach(item => {
    const tile = document.createElement('div');
    tile.className = 'photo-tile';
    tile.innerHTML = `
      <img src="https://drive.google.com/thumbnail?id=${item.id}&sz=w800" alt="${escapeHtml(item.caption)}" loading="lazy">
      <span class="caption">${escapeHtml(item.caption)}</span>
    `;
    tile.addEventListener('click', () => openLightbox(item));
    galleryGrid.appendChild(tile);
  });
}

function openLightbox(item){
  currentLightboxItem = item;
  lightboxPhoto.innerHTML = `<img src="https://drive.google.com/thumbnail?id=${item.id}&sz=w1200" alt=""><div class="lightbox-caption-wrap" id="captionWrap"></div>`;
  renderCaptionView();
  lightbox.classList.add('show');
}

function renderCaptionView(){
  const wrap = document.getElementById('captionWrap');
  wrap.innerHTML = `
    <h3 title="Klicken zum Umbenennen">${escapeHtml(currentLightboxItem.caption)}</h3>
    <div class="edit-hint">Titel anklicken, um ihn zu ändern</div>
  `;
  wrap.querySelector('h3').addEventListener('click', enterEditMode);
}

function enterEditMode(){
  if(!currentLightboxItem) return;
  const wrap = document.getElementById('captionWrap');
  wrap.innerHTML = `<input type="text" class="edit-title" id="titleInput" value="${escapeHtml(currentLightboxItem.caption)}">`;
  const input = document.getElementById('titleInput');
  input.focus();
  input.select();
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') input.blur();
    if(e.key === 'Escape'){ input.dataset.cancel = '1'; input.blur(); }
  });
  input.addEventListener('blur', () => saveTitle(input));
}

async function saveTitle(input){
  const cancelled = input.dataset.cancel === '1';
  const newTitle = input.value.trim();
  if(cancelled || !newTitle || newTitle === currentLightboxItem.caption){
    renderCaptionView();
    return;
  }
  currentLightboxItem.caption = newTitle;
  renderCaptionView();
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'rename', id: currentLightboxItem.id, title: newTitle })
    });
    loadGallery();
  }catch(err){
    showUploadStatus('Titel konnte nicht geändert werden. Prüfe die Verbindung.', true);
  }
}

async function deleteCurrentPhoto(){
  if(!currentLightboxItem) return;
  const ok = window.confirm(`"${currentLightboxItem.caption}" wirklich löschen? Das kann nicht rückgängig gemacht werden.`);
  if(!ok) return;

  lightboxDelete.disabled = true;
  lightboxDelete.textContent = 'Wird gelöscht…';
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', id: currentLightboxItem.id })
    });
    lightbox.classList.remove('show');
    currentLightboxItem = null;
    loadGallery();
  }catch(err){
    showUploadStatus('Foto konnte nicht gelöscht werden. Prüfe die Verbindung.', true);
  }finally{
    lightboxDelete.disabled = false;
    lightboxDelete.textContent = 'Löschen';
  }
}

lightboxDelete.addEventListener('click', deleteCurrentPhoto);

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

lightboxClose.addEventListener('click', () => lightbox.classList.remove('show'));
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) lightbox.classList.remove('show');
});

/* =========================================================
   Foto-Upload: verkleinert das Bild im Browser (schneller
   Upload) und schickt es als Base64 an das Apps Script,
   das es im Drive-Ordner speichert.
   ========================================================= */
function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim){
        if (width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(objectUrl);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = objectUrl;
  });
}

addTile.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const files = Array.from(fileInput.files || []);
  if(!files.length) return;

  if(!isConfigured()){
    showUploadStatus('Die Galerie ist noch nicht eingerichtet (siehe galerie-anleitung.md).', true);
    fileInput.value = '';
    return;
  }

  const titleRaw = window.prompt(
    files.length > 1 ? 'Titel für die Fotos (optional):' : 'Titel für das Foto (optional):',
    ''
  );
  const baseTitle = (titleRaw || '').trim();

  addTile.style.pointerEvents = 'none';
  let done = 0;

  for(const file of files){
    showUploadStatus(`Foto wird hochgeladen… (${done + 1}/${files.length})`, false);
    try{
      const dataUrl = await resizeImage(file, 1600, 0.85);
      const base64 = dataUrl.split(',')[1];
      let filenameBase = baseTitle || file.name.replace(/\.[^/.]+$/, '');
      if(baseTitle && files.length > 1) filenameBase = `${baseTitle} (${done + 1})`;

      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // vermeidet CORS-Preflight
        body: JSON.stringify({
          action: 'upload',
          filename: filenameBase,
          mimeType: 'image/jpeg',
          data: base64
        })
      });
      done++;
    }catch(err){
      showUploadStatus('Upload fehlgeschlagen. Prüfe die Apps-Script-URL/Verbindung.', true);
      addTile.style.pointerEvents = '';
      fileInput.value = '';
      return;
    }
  }

  showUploadStatus(done > 1 ? `${done} Fotos hochgeladen! ❤️` : 'Foto hochgeladen! ❤️', false);
  fileInput.value = '';
  addTile.style.pointerEvents = '';
  loadGallery();
});

loadGallery();
</script>

</body>
</html>
